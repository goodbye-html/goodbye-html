name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    runs-on: burn
    strategy:
      matrix:
        php-version: [8.2]

    steps:
      - name: Install PHP
        uses: act/install-php
        with:
          php-version: {{ matrix.php-version }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install composer dependencies
        run: |
          composer validate
          composer install --prefer-dist --no-progress --no-suggest

      - name: Run tests and checks
        run: composer check
